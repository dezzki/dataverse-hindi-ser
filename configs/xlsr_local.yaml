model_name: facebook/wav2vec2-large-xlsr-53
pooling: meanstd
freeze_encoder_layers: 12
grad_ckpt: true
sample_rate: 16000
max_seconds: 6.0
trim_silence: true
trim_top_db: 40.0
batch_size: 4
grad_accum: 8
lr: 8.0e-5
head_lr: 1.0e-4
encoder_lr_scale: 0.05
layer_lr_decay: 0.95
warmup_frac: 0.1
epochs: 10
early_stop_patience: 3
grad_clip: 1.0
weight_decay: 0.01
mixed_precision: fp16
scheduler: cosine
label_smoothing: 0.1
mixup_alpha: 0.2
num_folds: 5
folds: [0, 1, 2, 3, 4]
seed: 42
num_workers: 2
aug:
  speed: {enabled: true, prob: 0.5, min_rate: 0.9, max_rate: 1.1}
  pitch: {enabled: true, prob: 0.5, min_steps: -2.0, max_steps: 2.0}
  noise: {enabled: true, prob: 0.5, min_snr_db: 10.0, max_snr_db: 30.0}
  specaug: {enabled: true, prob: 0.5, num_freq_masks: 2, freq_mask_width: 27, num_time_masks: 2, time_mask_width: 100}
  mixup: {prob: 1.0}
tta: false
data_root: data/SRCASW-BhavVaani
output_dir: runs
oof_dir: oof
aux_root: ext/my Dataset
aux_csv: ext/aux_hindi.csv
