# XLSR-53 (multilingual wav2vec2, 300M+) fine-tune for Hindi SER.
#
# 6 GB local GPU: batch 4 + grad_accum 8 + gradient checkpointing. On Kaggle
# (16 GB) you can drop `grad_ckpt`, use `batch_size: 16` and `grad_accum: 2`.
#
# Hindi-specific alternatives (same architecture, drop-in):
#   - ai4bharat/indicwav2vec-hindi          (in-domain self-supervised)
#   - vasista22/ctrl_wav2vec2-large-xlsr-hindi
model_name: facebook/wav2vec2-large-xlsr-53
pooling: meanstd            # meanstd | attention
freeze_encoder_layers: 0    # e.g. 12 to train only the top half
grad_ckpt: true

sample_rate: 16000
max_seconds: 6.0
trim_silence: true
trim_top_db: 40.0

batch_size: 4               # 16 on Kaggle
grad_accum: 8               # 2 on Kaggle
lr: 1.0e-4                  # base LR (encoder gets lr * encoder_lr_scale)
head_lr: 1.0e-4             # classification head LR
encoder_lr_scale: 0.1
layer_lr_decay: 0.95
warmup_frac: 0.1
epochs: 10
early_stop_patience: 3
grad_clip: 1.0
weight_decay: 0.01

mixed_precision: fp16       # fp16 | bf16 | none
scheduler: cosine           # cosine | linear | constant | onecycle
label_smoothing: 0.05
mixup_alpha: 0.2

num_folds: 5
folds: [0, 1, 2, 3, 4]
seed: 42
num_workers: 2

aug:                        # any block can be `false` to switch it off
  speed: {enabled: true, prob: 0.5, min_rate: 0.9, max_rate: 1.1}
  pitch: {enabled: true, prob: 0.5, min_steps: -2.0, max_steps: 2.0}
  noise: {enabled: true, prob: 0.5, min_snr_db: 10.0, max_snr_db: 30.0}
  specaug: {enabled: true, prob: 0.5, num_freq_masks: 2, freq_mask_width: 27,
            num_time_masks: 2, time_mask_width: 100}
  mixup: {prob: 1.0}

tta: false
tta_crops: 3

data_root: data/SRCASW-BhavVaani
output_dir: runs
oof_dir: oof
